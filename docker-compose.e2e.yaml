services:
  postgres-e2e:
    image: postgres:16
    environment:
      POSTGRES_USER: avito
      POSTGRES_PASSWORD: avito
      POSTGRES_DB: avito_kitchen_e2e
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avito -d avito_kitchen_e2e"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate-e2e:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres-e2e:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://avito:avito@postgres-e2e:5432/avito_kitchen_e2e?sslmode=disable",
        "up",
      ]

  api-e2e:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate-e2e:
        condition: service_completed_successfully
    environment:
      APP_PORT: "8080"
      DATABASE_URL: postgres://avito:avito@postgres-e2e:5432/avito_kitchen_e2e?sslmode=disable
    ports:
      - "8090:8080"
