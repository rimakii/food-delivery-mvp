openapi: 3.0.3
info:
  title: Авито.Кухня API
  version: 0.1.0
  description: >
    API сервиса Авито.Кухня.
servers:
  - url: http://localhost:8080

security: []

tags:
  - name: client
    description: API для клиентской части
  - name: restaurant
    description: API для заведений
  - name: system

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Проверка доступности сервиса и БД
      responses:
        "200":
          description: сервис и БД доступны
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "503":
          description: БД недоступна
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: down }

  /restaurants:
    get:
      tags: [client]
      operationId: listRestaurants
      summary: Список заведений
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Restaurant" }

  /restaurants/{restaurantID}/menu:
    get:
      tags: [client]
      operationId: getMenu
      summary: Меню заведения (с остатками)
      parameters:
        - $ref: "#/components/parameters/RestaurantID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MenuItem" }
        "404":
          description: заведение не найдено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /restaurants/{restaurantID}/menu-items:
    post:
      tags: [restaurant]
      operationId: createMenuItem
      summary: Создать позицию меню
      parameters:
        - $ref: "#/components/parameters/RestaurantID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMenuItemRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuItem" }
        "400":
          description: невалидный запрос
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: заведение не найдено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /restaurants/{restaurantID}/menu-items/{itemID}:
    put:
      tags: [restaurant]
      operationId: updateMenuItem
      summary: Обновить название/цену позиции меню (stock не трогает)
      parameters:
        - $ref: "#/components/parameters/RestaurantID"
        - $ref: "#/components/parameters/ItemID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMenuItemRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuItem" }
        "400":
          description: невалидный запрос
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: позиция не найдена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /restaurants/{restaurantID}/menu-items/{itemID}/stock:
    patch:
      tags: [restaurant]
      operationId: adjustMenuItemStock
      summary: Изменить остаток на delta (может быть отрицательным)
      parameters:
        - $ref: "#/components/parameters/RestaurantID"
        - $ref: "#/components/parameters/ItemID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustStockRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuItem" }
        "400":
          description: невалидный запрос
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: позиция не найдена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: delta увела бы остаток в минус
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /restaurants/{restaurantID}/orders:
    get:
      tags: [restaurant]
      operationId: listRestaurantOrders
      summary: Заказы заведения (без позиций — детали через GET /orders/{orderID})
      parameters:
        - $ref: "#/components/parameters/RestaurantID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }

  /orders:
    post:
      tags: [client]
      operationId: createOrder
      summary: Оформить заказ (атомарно списывает stock по каждой позиции)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: пустой заказ / отрицательное количество / невалидный restaurant_id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: недостаточно stock хотя бы по одной позиции
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orders/{orderID}:
    get:
      tags: [client]
      operationId: getOrder
      summary: Заказ по ID (с позициями)
      parameters:
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: невалидный ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: заказ не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orders/{orderID}/status:
    patch:
      tags: [restaurant]
      operationId: updateOrderStatus
      summary: Сменить статус заказа
      parameters:
        - $ref: "#/components/parameters/OrderID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStatusRequest" }
      responses:
        "204":
          description: No Content
        "400":
          description: невалидный ID/статус
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: заказ не найден
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  parameters:
    RestaurantID:
      name: restaurantID
      in: path
      required: true
      schema: { type: integer, format: int32 }
    ItemID:
      name: itemID
      in: path
      required: true
      schema: { type: integer, format: int32 }
    OrderID:
      name: orderID
      in: path
      required: true
      schema: { type: integer, format: int64 }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    Restaurant:
      type: object
      properties:
        id: { type: integer, format: int32 }
        name: { type: string }
        created_at: { type: string, format: date-time }

    MenuItem:
      type: object
      properties:
        id: { type: integer, format: int32 }
        restaurant_id: { type: integer, format: int32 }
        name: { type: string }
        price_cents: { type: integer, format: int64 }
        stock: { type: integer, format: int32 }
        created_at: { type: string, format: date-time }

    CreateMenuItemRequest:
      type: object
      required: [name, price_cents]
      properties:
        name: { type: string }
        price_cents: { type: integer, format: int64, minimum: 0 }
        stock: { type: integer, format: int32, minimum: 0, default: 0 }

    UpdateMenuItemRequest:
      type: object
      required: [name, price_cents]
      properties:
        name: { type: string }
        price_cents: { type: integer, format: int64, minimum: 0 }

    AdjustStockRequest:
      type: object
      required: [delta]
      properties:
        delta:
          type: integer
          format: int32
          description: может быть отрицательным (списание)

    OrderStatus:
      type: string
      enum: [new, confirmed, cancelled]

    OrderItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        menu_item_id: { type: integer, format: int32 }
        quantity: { type: integer }
        price_cents: { type: integer, format: int64 }

    Order:
      type: object
      properties:
        id: { type: integer, format: int64 }
        restaurant_id: { type: integer, format: int32 }
        status: { $ref: "#/components/schemas/OrderStatus" }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
          description: >
            Заполнено в GET /orders/{orderID} и в ответе POST /orders;
            в списке GET /restaurants/{restaurantID}/orders — пусто.
        created_at: { type: string, format: date-time }

    CreateOrderItemRequest:
      type: object
      required: [menu_item_id, quantity]
      properties:
        menu_item_id: { type: integer, format: int32 }
        quantity: { type: integer, minimum: 1 }

    CreateOrderRequest:
      type: object
      required: [restaurant_id, items]
      properties:
        restaurant_id: { type: integer, format: int32 }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CreateOrderItemRequest" }

    UpdateStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/OrderStatus" }
